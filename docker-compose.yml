services:
  api:
    container_name: steamshark-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-:8800}
      - DB_PATH=${DB_PATH:-/app/data/steamshark.db}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-steamshark}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    ports:
      - 8800:8800
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8800/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=${POSTGRES_DATA:-/data/postgres}
      - POSTGRES_DB=${POSTGRES_DB:-steamshark}
    volumes:
      - db:/data/postgres
    configs:
      - source: schema_sql
        target: /docker-entrypoint-initdb.d/01_schema.sql
      - source: seed_sql
        target: /docker-entrypoint-initdb.d/02_seed.sql
    #ports:
    #  - "5332:5432"
    expose:
      - 5432
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-steamshark}"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  db:
    driver: bridge

volumes:
  db:

#volumes:
#  steamshark_db:

configs:
  schema_sql:
    content: |
      CREATE TABLE IF NOT EXISTS websites (
        id text PRIMARY KEY,
        url text NOT NULL,
        domain text NOT NULL UNIQUE,
        ssl_certificate boolean NOT NULL DEFAULT false,
        display_name text,
        tld text NOT NULL,
        description text,
        type text NOT NULL DEFAULT 'website',
        is_not_trusted boolean NOT NULL DEFAULT true,
        is_official boolean NOT NULL DEFAULT false,
        steam_login_present boolean NOT NULL DEFAULT false,
        verified boolean NOT NULL DEFAULT false,
        risk_score double precision NOT NULL DEFAULT 0.0,
        risk_level text NOT NULL DEFAULT 'unknown',
        status text NOT NULL DEFAULT 'active',
        notes text,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        CHECK (risk_score >= 0.0 AND risk_score <= 100.0),
        CHECK (type IN ('website','tool','extension')),
        CHECK (risk_level IN ('unknown','none','low','medium','high','critical')),
        CHECK (status IN ('active','inactive','blocked','archived'))
      );

      CREATE INDEX IF NOT EXISTS idx_websites_url ON websites(url);

      CREATE OR REPLACE FUNCTION set_updated_at()
      RETURNS trigger AS $$
      BEGIN
        NEW.updated_at := now();
        RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;

      DO $$
      BEGIN
        IF NOT EXISTS (
          SELECT 1
          FROM pg_trigger
          WHERE tgname = 'trg_websites_updated_at'
        ) THEN
          CREATE TRIGGER trg_websites_updated_at
          BEFORE UPDATE ON websites
          FOR EACH ROW
          EXECUTE FUNCTION set_updated_at();
        END IF;
      END;
      $$;

